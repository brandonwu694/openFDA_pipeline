[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openFDA-pipeline"
version = "0.1.0"
description = "Ingest and process openFDA medical device recall data"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "pandas>=2.2", "matplotlib>=3.8"]

[project.scripts]
backfill = "openFDA_pipeline.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
