[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openFDA-pipeline"
version = "0.1.0"
description = "Ingest and process openFDA medical device recall data"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pyarrow>=18", "duckdb>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "pandas>=2.2", "matplotlib>=3.8"]

[project.scripts]
backfill = "openFDA_pipeline.backfill:main"
ingest = "openFDA_pipeline.ingestion.device_enforcement:main"
bronze = "openFDA_pipeline.bronze.raw_to_bronze:main"
silver = "openFDA_pipeline.silver.device_enforcement:main"
gold = "openFDA_pipeline.gold.device_enforcement:main"
openfda-pipeline = "openFDA_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openFDA_pipeline.silver" = ["sql/*.sql"]
"openFDA_pipeline.gold" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
